{% extends "base.html" %}
{% block start %}

<style>
    body {
        background: #eef2ef;
    }

    .update-card {
        border: 0;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 16px 40px rgba(20, 48, 47, 0.15);
    }

    .update-card h2 {
        font-weight: 700;
        color: #14302f;
        margin-bottom: 0;
    }

    .update-card hr {
        margin: 1rem 0 1.5rem;
        opacity: 0.15;
    }

    .update-card .form-label {
        font-weight: 500;
        color: #14302f;
    }

    .update-card .form-control,
    .update-card .form-select {
        padding: 0.65rem 0.9rem;
        border: 1px solid #d5dfdb;
        border-radius: 10px;
    }

    .update-card .form-control:focus,
    .update-card .form-select:focus {
        border-color: #0f5257;
        box-shadow: 0 0 0 0.2rem rgba(15, 82, 87, 0.2);
    }

    .update-card .btn-brand {
        width: 100%;
        padding: 0.7rem;
        font-weight: 500;
        color: #ffffff;
        background: #0f5257;
        border-color: #0f5257;
        border-radius: 10px;
    }

    .update-card .btn-brand:hover {
        background: #0a3b3f;
        border-color: #0a3b3f;
    }

    .update-card .btn-cancel {
        width: 100%;
        padding: 0.7rem;
        color: #0f5257;
        border: 1px solid #d5dfdb;
        border-radius: 10px;
        background: transparent;
    }

    .update-card .btn-cancel:hover {
        background: #eef2ef;
    }
</style>

<div class="container mt-5 mb-5">

    <form class="col-12 col-md-8 col-lg-5 mx-auto card update-card p-4" method="post">
        {% csrf_token %}

        <h2>Update Expense</h2>
        <hr>

        <div class="mb-3">
            <label for="expense_name" class="form-label">Expense Name</label>
            <input
                id="expense_name"
                name="expense_name"
                required
                type="text"
                class="form-control"
                value="{{ expenses.name }}"
            >
        </div>

        <div class="mb-3">
            <label for="expense_amount" class="form-label">Amount (₹)</label>
            <input
                id="expense_amount"
                class="form-control"
                name="expense_amount"
                type="number"
                min="0"
                step="0.01"
                required
                value="{{ expenses.amount }}"
            >
        </div>

        <div class="mb-3">
            <label for="expense_category" class="form-label">Category</label>
            <select id="expense_category" class="form-select" name="expense_category" required>
                <option value="">Select Category</option>
                <option value="Food" {% if expenses.category == "Food" %}selected{% endif %}>Food</option>
                <option value="Travel" {% if expenses.category == "Travel" %}selected{% endif %}>Travel</option>
                <option value="Shopping" {% if expenses.category == "Shopping" %}selected{% endif %}>Shopping</option>
                <option value="Education" {% if expenses.category == "Education" %}selected{% endif %}>Education</option>
                <option value="Bills" {% if expenses.category == "Bills" %}selected{% endif %}>Bills</option>
                <option value="Other" {% if expenses.category == "Other" %}selected{% endif %}>Other</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="expense_date" class="form-label">Date</label>
            <input
                id="expense_date"
                type="date"
                class="form-control"
                name="expense_date"
                required
                value="{{ expenses.date|date:'Y-m-d' }}"
            >
        </div>

        <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-brand">Update Expense</button>
            <a href="/" class="btn btn-cancel">Cancel</a>
        </div>

    </form>

</div>

{% endblock %}
