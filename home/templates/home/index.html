{% extends "home/base.html" %}
{% block start %}
   <table>
    <tr>
        <th>S. no</th>
        <th>Name</th>
        <th>Age</th>
        <th>Can Vote</th>
    </tr>

    {% for people in peoples %}
    <tr>
        <td>{{ forloop.counter }}</td>
        <td>{{ people.name }}</td>
        <td>{{ people.age }}</td>

        <td>
            {% if people.age >= 18 %}
                👍
            {% else %}
                👎
            {% endif %}
        </td>
    </tr>
    {% endfor %}
</table>

  <a href="/about/">About Section</a>
    <a href="/contact/">Contact details</a>
{% endblock %}
